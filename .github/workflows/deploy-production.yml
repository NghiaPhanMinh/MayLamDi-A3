name: Validate and deploy production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maylamdi-a3-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_onxmvi5aOyVqqCuAdwzG67zP
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy Vercel and Convex
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://may-lam-di-a3.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm deployment credentials
        id: check_creds
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "Direct GitHub-Vercel integration is active; skipping manual token deployment."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          fi

      - name: Link official Vercel project
        if: steps.check_creds.outputs.has_creds == 'true'
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: steps.check_creds.outputs.has_creds == 'true'
        run: npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
